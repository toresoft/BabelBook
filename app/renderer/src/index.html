<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>babelBook</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The window is served over the app:// scheme, which gives it a real origin
      and makes 'self' mean something. Angular writes component styles into the
      document, which is why style-src has to allow inline styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: app:; font-src 'self'; connect-src 'self'"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
