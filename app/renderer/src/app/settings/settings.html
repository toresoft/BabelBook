<section class="settings" data-testid="settings" *transloco="let t">
  <header class="settings__bar">
    <a class="settings__back" routerLink="/">{{ t('app.library') }}</a>
    <h1>{{ t('app.settings') }}</h1>
  </header>

  <nav class="tabs tabs-border">
    @for (name of sections; track name) {
      <button
        type="button"
        class="tab"
        [class.tab-active]="active() === name"
        [attr.data-testid]="'section-' + name"
        [routerLink]="['/settings', name]">
        {{ t('settings.sections.' + name) }}
      </button>
    }
  </nav>

  <div class="settings__panel">
    @switch (active()) {
      @case ("providers") { <bb-providers /> }
      @case ("glossaries") { <bb-glossaries /> }
      @case ("translation") { <bb-preferences group="translation" /> }
      @case ("application") { <bb-preferences group="application" /> }
    }
  </div>
</section>
